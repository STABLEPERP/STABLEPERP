[package]
name = "stableperp"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"
rust-version = "1.75.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "stableperp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022", "token"] }
block-buffer = "=0.10.4"
blake3 = "=1.5.0"
hashbrown = "=0.14.3"
zeroize = "=1.3.0"
zeroize_derive = "=1.4.2"
proc-macro-crate = "=3.0.0"
toml_datetime = "0.6.5"


